name: scrapi

services:
  app:
    image: scrapi-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
      - .env.production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - traefik-public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10700/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s
    deploy:
      mode: replicated
      replicas: 2
      resources:
        limits:
          memory: 3G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.scrapi.rule=Host(`scrapi.damln.com`)"
        - "traefik.http.routers.scrapi.entrypoints=websecure"
        - "traefik.http.routers.scrapi.tls=true"
        - "traefik.http.routers.scrapi.tls.certresolver=letsencrypt"
        - "traefik.http.routers.scrapi.tls.domains[0].main=scrapi.damln.com"
        - "traefik.http.services.scrapi.loadbalancer.server.port=10700"

networks:
  traefik-public:
    external: true
