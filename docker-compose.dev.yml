services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "10700:10700"
    volumes:
      - .:/app
      - ./cache:/cache
    env_file:
      - .env
      - .env.development
    environment:
      - CACHE_DIR=/cache
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "10700", "--reload"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10700/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s
